spring.application.name=run-buddy
# Which ActivitySource to use (ADR-0004). Only "dummy" exists in Phase 1.
runbuddy.activity-source=dummy
# Everyone acts as this user until sign-in exists. Row level security scopes data to it.
runbuddy.default-user-id=demo

# Where plans and runs are stored (ADR-0007 spike): jooq | jdbc | jdbcclient | memory (use the "memory" profile).
runbuddy.persistence=jooq

# Local PostgreSQL from the repository's compose.yaml.
# The app connects as a role that does not own the tables, so row level security applies;
# Flyway migrates as the owner.
spring.datasource.url=jdbc:postgresql://localhost:5432/runbuddy
spring.datasource.username=runbuddy_app
spring.datasource.password=runbuddy_app
spring.flyway.user=runbuddy
spring.flyway.password=runbuddy
