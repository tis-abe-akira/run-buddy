spring.application.name=run-buddy
# Local settings from the repository root's .env (see .env.example), whether the app is started
# from the root or from backend/. Optional, so nothing breaks without one; environment variables
# still take precedence over it.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
# Which ActivitySource to use (ADR-0004): dummy (generated runs) or garmin (ADR-0009).
runbuddy.activity-source=${RUNBUDDY_ACTIVITY_SOURCE:dummy}
# Garmin Connect Personal API. The key comes from Garmin Connect Web's "Personal API Key" page and
# expires after 30 days to a year. With activity-source=garmin and no key, startup fails.
runbuddy.garmin.api-key=${GARMIN_API_KEY:}
runbuddy.garmin.base-url=https://personal.connectapi.garmin.com
# Everyone acts as this user until sign-in exists. Row level security scopes data to it.
runbuddy.default-user-id=demo

# Where plans and runs are stored (ADR-0007): jooq, or memory via the "memory" profile.
runbuddy.persistence=jooq

# Local PostgreSQL from the repository's compose.yaml.
# The app connects as a role that does not own the tables, so row level security applies;
# Flyway migrates as the owner.
# RUNBUDDY_DB_PORT must match the port compose.yaml publishes (default 5432).
spring.datasource.url=jdbc:postgresql://localhost:${RUNBUDDY_DB_PORT:5432}/runbuddy
spring.datasource.username=runbuddy_app
spring.datasource.password=runbuddy_app
spring.flyway.user=runbuddy
spring.flyway.password=runbuddy

# AI advisor (ADR-0008). Each provider is offered only when its credentials are set.
# The rule-based fake needs none; turn it off in production.
runbuddy.ai.fake.enabled=true
# Gemini Developer API. The first model is the default; names must match Google's model ids.
# Measured 2026-10-31 (ADR-0008): 2.5-flash answers in ~10 s; 3.5-flash analyses more deeply but
# takes 40-90 s; 3.8-flash took over 3 minutes, too slow for a conversation.
runbuddy.ai.gemini.api-key=${GEMINI_API_KEY:}
runbuddy.ai.gemini.models=gemini-2.5-flash,gemini-3.5-flash

# Logging of run-buddy's own classes. INFO shows the activity source at startup, each import and
# each advisor answer; DEBUG adds Garmin's per-page requests and token reuse. Read from .env too.
logging.level.com.example.runbuddy=${RUNBUDDY_LOG_LEVEL:INFO}
